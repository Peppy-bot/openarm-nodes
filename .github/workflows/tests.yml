name: Tests

# Runs the repository's Rust and Python tests. The inventory is discovered
# from the filesystem on each run rather than maintained by hand — a new
# crate or test file starts running in CI on the pull request that adds it —
# and a pull request runs only the projects its diff touches: nine crates'
# test suites are too expensive to rerun for a one-node change. A change
# outside every project (this workflow, the repository index, ...) and every
# push to main still run the full suite, so anything a scoped run could miss
# is caught on the integration branch. Documentation is the one exception:
# a Markdown file outside every project is built and tested by nothing, so
# it selects nothing and triggers nothing.
#
# The crates depend on generated code (each node's gitignored `.peppy/libs`)
# that only a running peppy daemon can produce (`peppy node sync` calls the
# daemon's node_generate service, resolving contracts through the daemon's
# repository registry). So this job installs a peppy release, readies its
# bundled apptainer for unprivileged use, boots a daemon of its own,
# generates the tested nodes' interfaces, and then runs each crate's tests
# inside the container image its apptainer.def declares — the runner image
# provides no crate build deps. The runner is an ephemeral Blacksmith VM, so
# everything worth keeping between runs (test images, cargo registry,
# per-crate target dirs) lives on a sticky disk mounted below.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  discover-and-run:
    name: Every Rust and Python test the change reaches
    # x86 rather than the -arm label: the base images are published for both,
    # and the sticky disk key below carries the architecture, so switching is
    # a label change that starts from an empty disk rather than a wrong-arch one.
    runs-on: blacksmith-16vcpu-ubuntu-2404
    # A cold build compiles the crates' full dependency trees; the sticky disk
    # keeps warm runs far under this, but the first run after the disk is
    # evicted (7 idle days) or its key changes is legitimately slow.
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history: the discovery step diffs the pull request against
          # its base to decide which projects' tests to run.
          fetch-depth: 0
          # Nothing here pushes, so the job has no use for a writable
          # credential sitting in .git/config for every later step to inherit.
          persist-credentials: false

      # The derived test images, the cargo registry and the per-crate target
      # dirs live on a Blacksmith sticky disk: the runner's own disk is
      # discarded with the job. Every run mounts a clone of the disk's last
      # committed snapshot, so nothing stored here may be state one run
      # depends on another having written — only caches apptainer and cargo
      # can rebuild from scratch. Only pushes to main commit their clone: the
      # concurrency group serialises those, so commits never race, and a pull
      # request (possibly from a fork) reads the cache but cannot write into
      # what every later run builds on. A pull request therefore recompiles
      # just its own delta against main's warm snapshot. The key carries the
      # architecture because the cached .sif images are built for the host
      # that built them.
      - name: Mount the build caches
        uses: useblacksmith/stickydisk@35ba2e331a80056a42af053ee54968511de2b7c7 # v1.5.0
        with:
          key: ${{ github.repository }}-tests-${{ runner.arch }}
          path: ~/.cache/openarm-nodes-ci
          commit: ${{ github.event_name == 'push' }}

      # Rust tests are discovered per crate — cargo itself finds every #[test]
      # and tests/ target inside one — so the unit of the list is a directory
      # holding a Cargo.toml. Python tests are discovered per file with the
      # pytest naming conventions. `.peppy` is excluded because the generated
      # libs vendored there carry Cargo.tomls and tests of their own that are
      # peppy's to run, not this repository's; any `target/` or virtualenv
      # tree in the checkout is excluded for the same reason.
      #
      # A "project" is a top-level directory holding a crate or a node. On a
      # pull request only the projects the diff touches are selected; a file
      # changed outside every project falls back to the full suite, because
      # nothing narrower can be proven safe for it — except a Markdown file,
      # which nothing builds or tests, so it is skipped rather than escalated.
      # Every skipped project is named in the run summary, so a scoped run
      # never silently reads as full coverage.
      - name: Discover the tests this change reaches
        id: discover
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          find . -name Cargo.toml \
            -not -path '*/target/*' -not -path '*/.peppy/*' \
            -printf '%h\n' | sed 's|^\./||' | sort \
            > "$RUNNER_TEMP/all-rust-dirs.txt"
          find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) \
            -not -path '*/target/*' -not -path '*/.peppy/*' \
            -not -path '*/.venv/*' -not -path '*/venv/*' \
            | sed 's|^\./||' | sort \
            > "$RUNNER_TEMP/all-python-tests.txt"
          {
            cut -d/ -f1 "$RUNNER_TEMP/all-rust-dirs.txt"
            for manifest in */peppy.json5; do
              if [ -f "$manifest" ]; then dirname "$manifest"; fi
            done
          } | sort -u > "$RUNNER_TEMP/projects.txt"

          run_all=true
          scope="the full suite"
          : > "$RUNNER_TEMP/selected-projects.txt"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "${BASE_SHA:-}" ]; then
            if changed=$(git diff --name-only "$BASE_SHA...HEAD") && [ -n "$changed" ]; then
              run_all=false
              scope="the projects this pull request touches"
              while IFS= read -r file; do
                top=${file%%/*}
                if grep -qxF "$top" "$RUNNER_TEMP/projects.txt"; then
                  echo "$top" >> "$RUNNER_TEMP/selected-projects.txt"
                elif [[ "${file,,}" == *.md ]]; then
                  continue
                else
                  run_all=true
                  scope="the full suite ($file is outside every project)"
                  break
                fi
              done <<< "$changed"
              if [ "$run_all" = false ] && [ ! -s "$RUNNER_TEMP/selected-projects.txt" ]; then
                scope="nothing: this pull request changes only documentation outside every project"
              fi
            else
              echo "could not diff against the pull request base; running the full suite" >&2
            fi
          fi

          if [ "$run_all" = true ]; then
            cp "$RUNNER_TEMP/projects.txt" "$RUNNER_TEMP/selected-projects.txt"
            cp "$RUNNER_TEMP/all-rust-dirs.txt" "$RUNNER_TEMP/rust-test-dirs.txt"
            cp "$RUNNER_TEMP/all-python-tests.txt" "$RUNNER_TEMP/python-test-files.txt"
          else
            sort -u -o "$RUNNER_TEMP/selected-projects.txt" "$RUNNER_TEMP/selected-projects.txt"
            awk -F/ 'NR==FNR { sel[$0] = 1; next } $1 in sel' \
              "$RUNNER_TEMP/selected-projects.txt" "$RUNNER_TEMP/all-rust-dirs.txt" \
              > "$RUNNER_TEMP/rust-test-dirs.txt"
            awk -F/ 'NR==FNR { sel[$0] = 1; next } $1 in sel' \
              "$RUNNER_TEMP/selected-projects.txt" "$RUNNER_TEMP/all-python-tests.txt" \
              > "$RUNNER_TEMP/python-test-files.txt"
          fi

          # Only a selected project that is a node (peppy.json5) and actually
          # has tests needs its interface code generated. A tested node's
          # dependency on another node resolves through the daemon's
          # repository registry, which reads that node's manifest straight
          # from the checkout — the dependency itself needs no sync.
          : > "$RUNNER_TEMP/sync-dirs.txt"
          while IFS= read -r project; do
            if [ -f "$project/peppy.json5" ] \
              && grep -qE "^$project(/|\$)" \
                "$RUNNER_TEMP/rust-test-dirs.txt" "$RUNNER_TEMP/python-test-files.txt"; then
              echo "$project" >> "$RUNNER_TEMP/sync-dirs.txt"
            fi
          done < "$RUNNER_TEMP/selected-projects.txt"

          any=false
          if [ -s "$RUNNER_TEMP/rust-test-dirs.txt" ] || [ -s "$RUNNER_TEMP/python-test-files.txt" ]; then
            any=true
          fi
          echo "any=$any" >> "$GITHUB_OUTPUT"

          {
            echo "Running ${scope}."
            echo
            echo "### Rust test crates"
            if [ -s "$RUNNER_TEMP/rust-test-dirs.txt" ]; then
              sed 's/^/- /' "$RUNNER_TEMP/rust-test-dirs.txt"
            else
              echo "_none selected_"
            fi
            echo
            echo "### Python test files"
            if [ -s "$RUNNER_TEMP/python-test-files.txt" ]; then
              sed 's/^/- /' "$RUNNER_TEMP/python-test-files.txt"
            else
              echo "_none selected_"
            fi
            skipped=$(comm -23 "$RUNNER_TEMP/all-rust-dirs.txt" "$RUNNER_TEMP/rust-test-dirs.txt")
            if [ -n "$skipped" ]; then
              echo
              echo "### Skipped crates (untouched by this change)"
              echo "$skipped" | sed 's/^/- /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Installed by extracting the release under RUNNER_TEMP rather than
      # through scripts/install.sh: nothing here wants a ~/.peppy, and the
      # whole job lives in the checkout and its own temp dir. Unlike the
      # repository-index workflow this extracts the whole archive, not just
      # bin/peppy: `service serve` needs the bundled layout around the binary
      # (zenohd, and the apptainer install under bin/apptainer that the next
      # step readies). Set the PEPPY_VERSION repository variable to pin a
      # release; it defaults to the latest. The generator inside peppy must
      # match what the crates' committed Cargo.tomls expect of peppygen, so
      # bump the pin together with peppy releases that change generated code.
      #
      # PEPPY_VERSION reaches the script through the environment rather than a
      # `${{ }}` expansion, so its value is data the shell reads instead of
      # source the shell parses, and the shape check turns a typo into a named
      # failure rather than a 404 from a URL built out of it.
      - name: Install peppy
        if: steps.discover.outputs.any == 'true'
        env:
          PEPPY_VERSION: ${{ vars.PEPPY_VERSION }}
        run: |
          set -euo pipefail
          version="${PEPPY_VERSION:-latest}"
          if [[ "$version" == "latest" ]]; then
            channel="latest"
          elif [[ "$version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel="v${version#v}"
          else
            echo "PEPPY_VERSION must be 'latest' or a release such as 0.20.0, got: $version" >&2
            exit 1
          fi

          case "$(uname -m)" in
            x86_64 | amd64) arch="x86_64" ;;
            aarch64 | arm64) arch="aarch64" ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          dest="$RUNNER_TEMP/peppy-dist"
          mkdir -p "$dest"
          curl -fsSL --connect-timeout 10 --max-time 300 \
            "https://peppy.bot/$channel/peppy-$arch-unknown-linux-gnu.tgz" \
            | tar -xzf - -C "$dest"
          chmod +x "$dest/bin/peppy"
          echo "$dest/bin" >> "$GITHUB_PATH"

      # The daemon refuses to boot unless the apptainer install it resolves
      # is ready for unprivileged use: `newuidmap` on PATH, and on a kernel
      # that restricts unprivileged user namespaces through AppArmor (Ubuntu
      # 24.04's default) a root-installed profile keyed to the canonical path
      # of that install's `starter` binary. The VM is fresh, so every run
      # readies the install it just extracted: `peppy container setup` applies
      # whatever its fix script needs through sudo when stdin is not a
      # terminal, and rechecks before exiting 0. Today's Blacksmith image
      # mounts no AppArmor securityfs, so it needs nothing; the step is what
      # keeps that an observation rather than an assumption. The daemon would
      # find bin/apptainer beside bin/peppy by itself; it is exported because
      # the cargo step runs the same install directly.
      #
      # `apptainer build` runs a def's %post as fakeroot, which needs a
      # subordinate id range for the runner user besides newuidmap. The
      # runner image ships one; should it ever not, this allocates one past
      # the highest range in use rather than failing in openarm_ker's apt-get
      # a cold build later.
      - name: Ready the bundled apptainer for unprivileged use
        if: steps.discover.outputs.any == 'true'
        run: |
          set -euo pipefail
          PEPPY_APPTAINER_DIR="$RUNNER_TEMP/peppy-dist/bin/apptainer"
          echo "PEPPY_APPTAINER_DIR=$PEPPY_APPTAINER_DIR" >> "$GITHUB_ENV"
          export PEPPY_APPTAINER_DIR
          peppy container setup < /dev/null

          user=$(id -un)
          for kind in subuid subgid; do
            if ! grep -qs "^$user:" "/etc/$kind"; then
              start=$(awk -F: 'BEGIN { m = 100000 } { e = $2 + $3; if (e > m) m = e } END { print m }' \
                "/etc/$kind" 2>/dev/null || echo 100000)
              sudo usermod "--add-${kind}s" "$start-$((start + 65535))" "$user"
            fi
          done

      # The daemon gets its own data root and port under RUNNER_TEMP: the CLI
      # finds it through PEPPY_HOME/daemon_state.json5, so pointing PEPPY_HOME
      # at the run's directory is discovery and isolation from any other
      # daemon in one. The name carries the run id because core-node names
      # must be unique among daemons that can reach each other.
      - name: Start an isolated peppy daemon
        if: steps.discover.outputs.any == 'true'
        run: |
          set -euo pipefail
          PEPPY_HOME="$RUNNER_TEMP/peppy-home"
          mkdir -p "$PEPPY_HOME"
          PEPPY_MESSAGING_PORT=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')
          {
            echo "PEPPY_HOME=$PEPPY_HOME"
            echo "PEPPY_MESSAGING_PORT=$PEPPY_MESSAGING_PORT"
          } >> "$GITHUB_ENV"
          export PEPPY_HOME PEPPY_MESSAGING_PORT

          nohup peppy service serve --core-node-name "ci-tests-$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/peppy-serve.log" 2>&1 &
          for _ in $(seq 1 30); do
            if [ -f "$PEPPY_HOME/daemon_state.json5" ]; then exit 0; fi
            sleep 1
          done
          echo "daemon did not come up; serve log:" >&2
          cat "$RUNNER_TEMP/peppy-serve.log" >&2
          exit 1

      # The bundled defaults register the GitHub copy of this repository.
      # With it present, one node's dependency on another node changed by this
      # pull request could resolve to the stale main-branch copy instead of
      # the checkout, so it is removed and the checkout registered in its
      # place. The other hub repositories stay: the contracts and outside
      # nodes some manifests depend on genuinely live there.
      - name: Generate the tested nodes' interface code
        if: steps.discover.outputs.any == 'true'
        run: |
          set -euo pipefail
          repo_id=$(grep -B 3 'Peppy-bot/openarm-nodes' "$PEPPY_HOME/conf/repositories.json5" \
            | sed -n 's/.*id: *\([0-9]*\),.*/\1/p' | head -1)
          if [ -n "$repo_id" ]; then
            peppy repo remove "$repo_id"
          fi
          peppy repo add "$GITHUB_WORKSPACE"
          peppy repo refresh

          # Only the nodes whose tests were selected; the generated code is
          # gitignored and per-node. --include-repositories lets a node's
          # dependency on a contract or another node resolve through the
          # registered repositories; nothing is in the node stack here.
          while IFS= read -r node_dir; do
            echo "::group::peppy node sync $node_dir"
            peppy node sync "$node_dir" --include-repositories
            echo "::endgroup::"
          done < "$RUNNER_TEMP/sync-dirs.txt"

      # Each selected crate's tests run inside the container image its
      # project's apptainer.def declares, so the runner host needs none of
      # the crates' system build deps (openarm_ker's serialport needs
      # libudev-dev, which only its def declares). The test image is derived
      # from the def — its base image plus its apt packages, without the
      # %files copy or the release build — and cached on the sticky disk
      # keyed by that derived content, so it rebuilds only when a def changes.
      # Build and exec run unprivileged through the same user-namespace
      # apptainer install readied above.
      #
      # Inside the container the workspace is /work and the daemon's data
      # root is bound at its host path, because each node's .peppy/libs
      # entries are absolute symlinks into it. The base image's rustup lives
      # under /root (its docker build ran as root) with no env set, hence the
      # explicit RUSTUP_HOME; CARGO_HOME and the per-crate target dirs are on
      # the sticky disk so registries and builds warm across runs. The
      # target dirs are per crate, never shared: every crate vendors a
      # generated `peppygen 0.1.0` with different contents, and in a shared
      # target dir cargo reuses one crate's peppygen artifact for another
      # (openarm_gripper_v2 compiled against openarm_gripper's parameters).
      # Incremental compilation is off: its caches are much of a debug target
      # dir and the sticky disk is billed per gigabyte, while all it would
      # save is the seconds a warm rebuild of a crate's own code takes.
      #
      # Every selected crate runs even after one fails, so a red run names
      # every failing crate instead of the first. --locked proves the build
      # consumed each committed lockfile rather than re-resolving it; the
      # diff check at the end proves nothing rewrote them. A lockfile
      # committed while the local-libs `[patch]` overrides were active
      # carries `[[patch.unused]]` entries that make --locked fail here with
      # cargo's unhelpful "cannot update the lock file": regenerate it
      # without the overrides.
      - name: Run the selected Rust tests in their build containers
        if: steps.discover.outputs.any == 'true'
        run: |
          set -euo pipefail
          apptainer="$PEPPY_APPTAINER_DIR/bin/apptainer"
          cache="$HOME/.cache/openarm-nodes-ci"
          mkdir -p "$cache/images" "$cache/cargo-home"
          export APPTAINER_CACHEDIR="$cache/apptainer-cache"
          failed=()
          while IFS= read -r crate_dir; do
            project=${crate_dir%%/*}
            def="$project/apptainer.def"
            if [ ! -f "$def" ]; then
              echo "::error::$crate_dir has no $def to derive its test image from"
              failed+=("$crate_dir")
              continue
            fi
            base=$(sed -n 's/^From: *//p' "$def" | head -1)
            pkgs=$(sed -n 's/.*apt-get install//p' "$def" \
              | tr ' \t' '\n\n' | sed '/^-/d;/^$/d' | sort -u | tr '\n' ' ')
            testdef="$RUNNER_TEMP/test-env-$project.def"
            {
              echo "Bootstrap: docker"
              echo "From: $base"
              echo
              echo "%post"
              echo "    set -eux"
              if [ -n "${pkgs% }" ]; then
                echo "    export DEBIAN_FRONTEND=noninteractive"
                echo "    apt-get update -y"
                echo "    apt-get install -y --no-install-recommends $pkgs"
                echo "    apt-get clean && rm -rf /var/lib/apt/lists/*"
              else
                echo "    true"
              fi
            } > "$testdef"
            sif="$cache/images/$(sha256sum "$testdef" | cut -d' ' -f1).sif"
            if [ ! -f "$sif" ]; then
              echo "::group::build test image for $project (from $base)"
              "$apptainer" build "$sif.tmp.$$" "$testdef"
              mv "$sif.tmp.$$" "$sif"
              echo "::endgroup::"
            fi
            mkdir -p "$cache/target/$crate_dir"
            echo "::group::cargo test: $crate_dir"
            if "$apptainer" exec --cleanenv --no-home \
                --pwd "/work/$crate_dir" \
                --bind "$GITHUB_WORKSPACE:/work" \
                --bind "$cache/cargo-home:/cargo" \
                --bind "$cache/target/$crate_dir:/target" \
                --bind "$RUNNER_TEMP/peppy-dist:/peppy-dist" \
                --bind "$PEPPY_HOME" \
                --env CARGO_HOME=/cargo \
                --env RUSTUP_HOME=/root/.rustup \
                --env CARGO_TARGET_DIR=/target \
                --env CARGO_INCREMENTAL=0 \
                --env PEPPY_ZENOHD_PATH=/peppy-dist/bin/zenohd \
                --env CARGO_TERM_COLOR=always \
                "$sif" cargo test --locked; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::cargo test failed in $crate_dir"
              failed+=("$crate_dir")
            fi
          done < "$RUNNER_TEMP/rust-test-dirs.txt"
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "failing crates: ${failed[*]}" >&2
            exit 1
          fi

      # pytest runs from a virtualenv rather than the runner image's Python,
      # so the tests see exactly what this step installs and nothing the image
      # happens to ship. Only pytest itself is installed: tests that need the
      # sim engines' heavyweight dependencies do not belong in this job, and
      # anything else a future test needs should be added here alongside it.
      - name: Run the selected Python tests
        if: steps.discover.outputs.any == 'true'
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/python-test-files.txt" ]; then
            echo "no Python test files selected; nothing to run"
            exit 0
          fi
          python3 -m venv "$RUNNER_TEMP/pytest-venv"
          "$RUNNER_TEMP/pytest-venv/bin/pip" install --quiet pytest
          xargs -a "$RUNNER_TEMP/python-test-files.txt" -d '\n' \
            "$RUNNER_TEMP/pytest-venv/bin/python" -m pytest

      # Proves what was tested is what is committed. The lock half proves the
      # builds consumed the committed lockfiles rather than re-resolving
      # them; the manifest half catches `peppy node sync` rewriting a
      # Cargo.toml, which happens whenever the repository lags the installed
      # generator's scaffolding — the fix is to run the sync locally and
      # commit the result. Must stay after the cargo step: placed before it,
      # it proves nothing.
      - name: Prove CI tested the committed manifests and lockfiles
        run: git diff --exit-code -- '*/Cargo.toml' '*/Cargo.lock'
